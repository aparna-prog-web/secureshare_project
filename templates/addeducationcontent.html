{% extends "adminindex.html" %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Educational Content</title>
{#  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">#}
 
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Educational Content</h2>
    <form action="/myapp/addeducationalcontent_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Contents</label>
        <div class="col-sm-8">
          <input type="file" name="content" class="form-control" id="name" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
