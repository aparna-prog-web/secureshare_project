
{% extends "adminindex.html" %}
{% block body %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
{#    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">#}
   
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">change password</h2>
                <form method="post" action="/myapp/change_password_post/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="current password">current password</label>
                        <input type="text" class="form-control" id="current password" name="current password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-group">
                        <label for=" new password"> new Password</label>
                        <input type=" new password" class="form-control" id=" new password" name="new password" placeholder="Enter new password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm password">confirm password</label>
                        <input type="confirm password" class="form-control" id="confirm password" name="confirm password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Submit</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
{% endblock %}
