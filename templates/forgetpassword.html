<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureShare | Forgot Password</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #000000;
      --accent: #00D4FF;
      --card-bg: rgba(15, 15, 26, 0.92);
      --glow: rgba(0, 212, 255, 0.55);
      --text: #ffffff;
      --text-muted: #c0c0e0;
    }

    body {
      background: var(--primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* Glowing ambient blobs */
    .blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: var(--glow);
      filter: blur(140px);
      border-radius: 50%;
      z-index: -1;
      opacity: 0.12;
    }

    .blob1 { top: -180px; left: -180px; }
    .blob2 { bottom: -180px; right: -180px; background: rgba(0, 212, 255, 0.08); }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 212, 255, 0.22);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-6px);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-glow {
      position: relative;
      display: inline-block;
    }

    .logo-icon {
      font-size: 6rem;
      color: var(--accent);
      filter: drop-shadow(0 0 25px var(--glow));
    }

    .logo-text {
      font-weight: 800;
      font-size: 2.8rem;
      background: linear-gradient(90deg, #ffffff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
      margin-top: 0.6rem;
      display: block;
    }

    h2 {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.8rem;
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .form-label {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: var(--text);
      display: block;
    }

    .form-control {
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(0, 212, 255, 0.25);
      background: rgba(30, 30, 45, 0.9);
      color: white;
      padding-left: 1.2rem;
      font-size: 1rem;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.18);
      background: rgba(30, 30, 45, 1);
      color: white;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      font-size: 1.3rem;
      pointer-events: none;
    }

    .btn-submit {
      background: linear-gradient(90deg, var(--accent), #00aaff);
      color: black;
      border: none;
      width: 100%;
      height: 54px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 1.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 10px 25px rgba(0, 212, 255, 0.28);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 212, 255, 0.38);
    }

    .back-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 2rem;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #00aaff;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2.5rem 1.8rem;
        margin: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="login-card">
    <div class="logo-area">
      <div class="logo-glow">
        <i class="fas fa-shield-halved logo-icon"></i>
      </div>
      <span class="logo-text">SecureShare</span>
      <p class="subtitle">Reset your password securely</p>
    </div>

    <h2>Forgot Password</h2>

    <form action="/myapp/forgetpassword_post/" method="post">
      {% csrf_token %}

      <div class="form-group position-relative">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your registered email" required>
        <i class="fas fa-envelope input-icon"></i>
      </div>

      <button type="submit" class="btn-submit">Send Reset Link</button>
    </form>

    <a href="/myapp/login_get/" class="back-link">← Back to Login</a>
  </div>

</body>
</html>
